<template>
    <lightning-card title="Create Fantasy Team">
        <div class="slds-p-around_medium">
            <!-- Nombre del equipo -->
            <lightning-input
                label="Name of the Team"
                value={teamName}
                onchange={handleNameChange}>
            </lightning-input>

            <!-- Drivers -->
            <lightning-dual-listbox
                name="drivers"
                label="Select 5 drivers"
                source-label="Available"
                selected-label="Selected"
                field-level-help="You must choose exactly 5 drivers"
                options={driverOptions}
                value={selectedDrivers}
                onchange={handleDriversChange}
                min="5"
                max="5">
            </lightning-dual-listbox>

            <!-- Constructors -->
            <lightning-dual-listbox
                name="constructors"
                label="Select 2 constructors"
                source-label="Available"
                selected-label="Selected"
                field-level-help="You must choose exactly 2 constructors"
                options={constructorOptions}
                value={selectedConstructors}
                onchange={handleConstructorsChange}
                min="2"
                max="2">
            </lightning-dual-listbox>

            <!-- Botón guardar -->
            <div class="slds-m-top_medium slds-text-align_right">
                <lightning-button
                    variant="brand"
                    label="Create team"
                    onclick={handleCreateTeam}
                    disabled={isSaving}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
