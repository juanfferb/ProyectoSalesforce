<template>
    <lightning-card title="Crear Equipo Fantasy">
        <div class="slds-p-around_medium">
            <!-- Nombre del equipo -->
            <lightning-input
                label="Nombre del equipo"
                value={teamName}
                onchange={handleNameChange}>
            </lightning-input>

            <!-- Drivers -->
            <lightning-dual-listbox
                name="drivers"
                label="Selecciona 5 pilotos"
                source-label="Disponibles"
                selected-label="Seleccionados"
                field-level-help="Debes elegir exactamente 5 pilotos"
                options={driverOptions}
                value={selectedDrivers}
                onchange={handleDriversChange}
                min="5"
                max="5">
            </lightning-dual-listbox>

            <!-- Constructors -->
            <lightning-dual-listbox
                name="constructors"
                label="Selecciona 2 escuderías"
                source-label="Disponibles"
                selected-label="Seleccionadas"
                field-level-help="Debes elegir exactamente 2 escuderías"
                options={constructorOptions}
                value={selectedConstructors}
                onchange={handleConstructorsChange}
                min="2"
                max="2">
            </lightning-dual-listbox>

            <!-- Botón guardar -->
            <div class="slds-m-top_medium slds-text-align_right">
                <lightning-button
                    variant="brand"
                    label="Crear equipo"
                    onclick={handleCreateTeam}
                    disabled={isSaving}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
