<template>
    <lightning-card title="Race Results Management" icon-name="custom:custom63">
        <div class="slds-p-around_medium">
            <p class="slds-text-body_regular slds-m-bottom_small">
                Click the button to load the official results of this race from the Formula 1 API.
            </p>
            <lightning-button 
                label="Load Results" 
                onclick={handleClick} 
                variant="brand" 
                icon-name="utility:refresh" 
                class="slds-m-bottom_medium">
            </lightning-button>
        </div>

        <template if:true={message}>
            <div class="slds-p-around_medium">
                <p class={messageClass}>{message}</p>
            </div>
        </template>
    </lightning-card>
</template>
